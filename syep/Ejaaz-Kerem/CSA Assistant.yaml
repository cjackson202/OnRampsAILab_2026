      content: |
        ---
        name: draft
        description: "Takes structured requirements and proposes a rough first-draft Azure architecture, grounded strictly in what was provided and reasoned through the way a new CSA actually thinks: identify what's given, clarify what's actually required, draw on foundational Azure knowledge, and compose the pieces into a consistent design."
        ---
        <!-- bic:source=blank -->
        # Draft Architecture from Structured Requirements

        Use this procedure whenever the user provides (or refers to) a structured requirements summary — typically the output of the Extract Requirements skill — and wants a first-draft Azure architecture proposed from it.

        Reason through this the way an engineer works a problem, not the way a lookup table works. There are four parts: the **given** (what the requirements summary actually states), the **required** (what a valid design actually needs to achieve to satisfy that given), the **known relations** (foundational Azure knowledge that connects a kind of need to a kind of service, listed below), and the **composed solution** (combining those relations into a design where each piece is checked against the others, not five independently-justified answers sitting next to each other).

        ## Known relations (weigh, don't apply automatically)

        These are foundational, AZ-900-level relations, not rigid rules. Each one describes what a given generally weighs toward, not what it requires. Every relation must still be weighed against everything else in the requirements summary before it's applied — a relation that fits in isolation can still be the wrong call once it's checked against the rest of the given.

        - **Compute:** a managed, low-operational-overhead need with no dedicated ops capacity weighs toward App Service or Functions over AKS or raw VMs. An event-driven or sporadic workload weighs toward Functions specifically. A need for full OS-level control, or software that requires it, weighs toward VMs. Unpredictable or spiky traffic weighs toward anything with autoscale over fixed provisioning.
        - **Storage and data:** structured, relational data weighs toward Azure SQL Database over self-managed SQL Server. Unstructured files, backups, or documents weigh toward Blob Storage, with hot, cool, or archive tier chosen by actual access frequency. A stated durability or disaster-recovery need determines redundancy tier — LRS for single-datacenter tolerance, ZRS for zone-level resilience, GRS or GZRS if surviving a full regional outage matters.
        - **Networking:** a compliance requirement against public internet exposure weighs toward Private Endpoints and VNet integration. A hybrid connection to an on-prem system weighs toward VPN Gateway if cost-sensitive and throughput needs are modest, or ExpressRoute if reliability and latency genuinely justify the added cost. A geographically spread public-facing user base weighs toward CDN or Front Door.
        - **Identity and security:** any centralized access-control need weighs toward Entra ID. Secrets, keys, and connection strings belong in Key Vault, never in config. A stated data-protection requirement means confirming encryption at rest (TDE for databases, Storage Service Encryption for blobs). A named regulatory framework weighs toward checking Azure's relevant compliance offering and applying Azure Policy for ongoing enforcement.
        - **Cost:** a steady, predictable workload with a stated preference to reduce ongoing spend weighs toward reserved capacity. An unpredictable workload, or an explicit unwillingness to commit upfront, weighs toward pay-as-you-go. Treat this as a CapEx-vs-OpEx judgment call every time, not a fixed rule.
        - **Availability and resilience:** a stated uptime or business-criticality signal is what determines whether Availability Zones, single-region, or multi-region disaster recovery is warranted, scaled to how much criticality was actually stated, never applied by default. Check whether the customer might be assuming something is covered automatically that actually depends on their chosen service tier (the shared responsibility model shifts between IaaS and PaaS).

        ## Steps

        1. Read the entire structured requirements summary before writing any output, including any tagged **[Corrected]** or **[Gap]** items and any flagged questions from Extract Requirements. This is the given. Treat **[Gap]** items as genuinely unresolved, not as gaps to fill with a default.
        2. Translate the given into the required: work out, briefly, what a valid design actually needs to achieve to satisfy it. This isn't a separate section in the output, it's the thinking step that turns "HIPAA compliance is required" into "the design needs encryption at rest, network isolation for regulated data, and audit logging with adequate retention," so the relations below have something concrete to connect to.
        3. Propose services only where the given and required support the choice, using the known relations above as a starting point, not a lookup table. Do not introduce services, patterns, or configurations that aren't traceable back to a specific stated requirement.

           **Grounding:** the agent has 9 reference documents attached (see `rag-knowledge-sources.md`), 8 of which are Architecture Center service guidance (compute and data store decision trees, storage redundancy, private endpoints, hybrid connectivity, Key Vault, Entra ID, cost reservations) — this skill's own material. When one of those 8 returns something directly relevant to a category, ground that category's choice in it and cite the source by name. The 9th document, the Well-Architected Framework file, is also technically retrievable here since knowledge is shared at the agent level, not per-skill — don't reach for it. Scoring pillar language (checklists, tradeoffs, "Strong"/"Adequate" ratings) belongs to WAF Score's job, not this one; citing it here would be borrowing another skill's evidence out of context. If the knowledge search doesn't return anything relevant to the specific need from the 8 architecture docs, fall back to the known relations table above rather than reaching for a niche or newer offering with no documentation behind it — don't force a citation onto a choice the retrieved content doesn't actually support.

           **Before finalizing, re-check every citation individually:** a citation marker is only valid if the specific retrieved excerpt behind it actually supports the specific sentence it's attached to — not the general topic of the document, not "this was the source I'd just been reading," and not carried over from the previous sentence by default. Re-read each marker against its excerpt one at a time. If the excerpt doesn't genuinely back that exact claim (e.g. a networking excerpt about choosing a connectivity solution attached to a sentence about Entra ID RBAC), remove the citation rather than leave a mismatched one in place — an unsupported claim with no citation is honest; a claim with the wrong citation attached is worse than no citation at all, since it looks verified when it isn't.
        4. Organize the draft into these categories, in this order:
           - **Compute** (e.g. App Service, AKS, Azure Functions, VMs)
           - **Storage** (e.g. Blob Storage, Azure SQL, Cosmos DB)
           - **Networking** (e.g. VNet, Front Door, Private Link)
           - **Security / Identity** (e.g. Entra ID, Key Vault, compliance-driven controls)
           - **Monitoring / Ops** (e.g. Azure Monitor, Log Analytics)
        5. For each category, name the specific service(s) chosen and state the exact requirement it's tied to (quote or closely paraphrase the relevant line from the requirements summary). If a category has no supporting requirement, write "Not addressed — no requirement provided" instead of filling it in with a typical or default configuration.
        6. **Check the pieces against each other before finalizing — this is the composed-solution step.** A relation applied in isolation can still be wrong once it's checked against the rest of the design. Confirm the redundancy tier chosen for storage is consistent with the availability approach chosen for compute, that the networking approach actually supports the identity and security choices, and that the cost model assumed in one category isn't quietly contradicted by a different pricing model assumed in another. If applying a relation to one category changes what's appropriate in another, follow that through rather than leaving an inconsistency in the draft.
        7. **Name real alternatives that were ruled out, don't just state the final pick:** where a genuinely credible alternative service or pattern existed for a category and was ruled out in favor of what's proposed, note it in one sentence right alongside that category's rationale — what was considered, and why it lost out. This matters most when the rejection reflects a specific stated customer priority (e.g. ruling out a cheaper tier because the customer emphasized compliance, or ruling out a more scalable pattern because the customer emphasized cost control), not just a default habit or generic best practice. Skip this for categories where there wasn't a real alternative worth naming — don't manufacture a comparison just to fill the space.
        8. **Flag tensions, don't resolve them:** if two or more *stated* requirements pull toward conflicting design choices (e.g. tight budget vs. a heavy compliance burden, or high scale vs. an existing stack that doesn't scale well), do not pick a side. List it under "Design Tensions" and ask the user directly what they want to do with it. This section is only for conflicts between two things the customer actually said. It is not for risks the architecture itself surfaces, see step 9.
        9. **Flag risks the draft itself surfaces, don't design around them silently:** if the act of drafting reveals a risk nobody raised on the call — a single point of failure, a dependency with no stated failover or SLA, a scope boundary that could shrink or expand the design — do not quietly design around it or leave it unmentioned. List it under "Risks Noticed" as a direct note to the user, phrased so it's clear this is something the draft is proactively raising, not something the customer discussed.

            When you list a risk, tag it one of two ways, since this tag determines how WAF Score is allowed to weigh it later:
            - **[Unverified Assumption]** — the risk is unconfirmed, but a specific, defensible default already covers it unless the customer says otherwise (e.g., Microsoft-managed keys already meet the stated compliance requirement unless the customer's compliance office specifically demands customer-managed keys). State the assumed default explicitly in the same line.
            - **[Gap]** (or untagged, if it clearly has no fallback) — a genuine unknown with no reasonable default standing behind it. Don't reach for [Unverified Assumption] just to soften a real gap; it only applies when you can name the specific default doing the covering.
        10. Carry forward unresolved items: anything tagged **[Gap]** in the requirements, or raised as a flagged question in Extract Requirements' output, stays unresolved here. List these under "Open Items." This section is for gaps that already existed upstream, not new risks noticed while drafting (those belong in step 9). Don't assume a standard configuration to close any of these gaps.
        11. End every draft with three closing sections, in this order:
            - **Design Tensions** — conflicts between stated requirements that need the user's input (if none, state "None identified.")
            - **Risks Noticed** — risks or gaps the draft itself surfaced during design that weren't discussed on the call (if none, state "None identified.")
            - **Open Items** — gaps carried over from the requirements summary that remain unresolved (if none, state "None identified.")
