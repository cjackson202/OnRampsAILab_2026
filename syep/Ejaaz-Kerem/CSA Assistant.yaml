    publisherUniqueName: DefaultPublisherorg39ea16bf
    schemaName: Default_CSA_Requirements_Extractor_322cd9.skill.waf_SHM
    dialog:
      kind: InlineAgentSkill
      skillFolderName: waf
      content: |-
        ---
        name: waf
        description: Scores a draft Azure architecture against the Well-Architected Framework's five pillars (Reliability, Security, Cost Optimization, Operational Excellence, Performance Efficiency), with a short justification per pillar.
        ---
        <!-- bic:source=blank -->
        # Score a Draft Architecture Against the Well-Architected Framework
        Use this procedure whenever the user provides (or refers to) a draft architecture — typically the output of the Draft Architecture skill — and wants it scored against the Well-Architected Framework's five pillars.
        ## Steps
        1. Read the entire draft architecture before scoring, including its Design Tensions, Risks Noticed, and Open Items sections. Those sections are not optional context — they directly limit what you can confidently score.
        2. Score each pillar, in this order: **Reliability, Security, Cost Optimization, Operational Excellence, Performance Efficiency.** Use this four-level rating for each: **Not Addressed / Emerging / Adequate / Strong.** Do not use a numeric score — a single rough draft doesn't support that level of precision.
        3. **Before writing each pillar's justification, actually search the `azure-well-architected` knowledge source for that specific pillar** — do not skip this because the questions below already look answerable from memory. That document is a single file covering all five pillars' design principles, checklists, and tradeoffs, and it's this skill's primary source; the bulleted questions below exist to tell you *what to search for and what to check the draft against per pillar*, not to substitute for actually checking the document. Even when the pillar's WAF checklist items (e.g. RE:06, SE:09, CO:12) are ones you already recognize, search anyway and cite what the search actually returns — familiarity with the general framework isn't the same as confirming what this specific attached document says, and a rating built on recalled-from-training checklist codes instead of a real retrieved excerpt is exactly the failure mode this step exists to prevent.
          Only fall back to reasoning from the questions below without a citation if the knowledge search genuinely returns nothing bearing on the specific judgment being made for that pillar — and when that happens, say so rather than silently omitting the citation, so it's visible that the source didn't cover that judgment rather than looking like the search was simply skipped.
          The other 8 attached documents are Draft Architecture's material (service-specific guidance: storage redundancy, Key Vault, networking, and so on) but are also retrievable here since knowledge is shared at the agent level. It's fair to cite one of those 8 when it directly confirms a technical detail relevant to a pillar (e.g. citing the storage redundancy doc to confirm ZRS actually provides zone-level resilience, when judging Reliability) — but don't use them to re-argue or second-guess the service choice itself; that decision was Draft Architecture's job, this skill only scores what's already there.
          What to search for and check per pillar:
          - **Reliability** — does the draft show resilience: failure handling, redundancy, recovery targets tied to the stated scale and workload type? A reliable design detects, withstands, and recovers from failure within an acceptable time.
          - **Security** — does the draft address identity and access control, data protection, and network segmentation tied to the stated compliance needs? Judge against a zero-trust baseline (verify explicitly, least-privilege access, assume breach).
          - **Cost Optimization** — are service choices tied to the stated budget sensitivity, with a clear rationale for tier/pricing-model choices? A cost-optimized workload isn't automatically a low-cost one; judge whether spend is justified against stated constraints, not whether it's cheap.
          - **Operational Excellence** — does the draft's Monitoring/Ops category define observability and standard operating practices, sized to the workload's actual complexity?
          - **Performance Efficiency** — does the draft's compute/storage/networking choices show a scaling strategy tied to the stated expected scale, rather than a fixed guess at capacity?
        4. **Write each justification as a named tradeoff, not a checklist observation.** State what was gained and what was given up, using the concrete Azure vocabulary the draft's choice actually reflects (e.g. availability zones, redundancy tier — locally redundant vs. zone-redundant vs. geo-redundant storage, reserved capacity vs. pay-as-you-go, SKU tier). For example, instead of "Key Vault is present, which is a good security signal," write "the draft accepted the operational overhead of centralized secret rotation through Key Vault in exchange for meeting the stated PCI DSS key management requirement." Cite the specific line(s) from the draft that support the rating. Never justify a rating using assumed best practice that isn't actually reflected in the draft, and never substitute generic language ("good," "reasonable," "solid") for actually naming the tradeoff.
        5. **Cap ratings honestly:** cap a pillar below "Strong" whenever there's a real gap bearing on it, whether that gap was already flagged upstream or you're noticing it for the first time while scoring. This includes: the category most relevant to the pillar was marked "Not addressed — no requirement provided" in the draft; an unresolved Design Tension bears on the pillar; a **[Gap]**-tagged or untagged item in Risks Noticed or Open Items bears on the pillar; or you notice a gap yourself that isn't written down anywhere upstream (e.g. the draft never addresses deployment practices, or never gives the data tier a performance strategy). In every case, rate it "Not Addressed" or "Emerging" as appropriate, and say explicitly that the cap is because something is unresolved or missing, not because the architecture is weak.
           An item tagged **[Unverified Assumption]** is the one exception: it does not automatically cap the pillar. Check whether the specific default named in the draft actually is sufficient to meet the stated requirement. If it is, you may leave the pillar uncapped for that item, but the justification must name the assumed default explicitly and say the rating rests on it holding. If the named default would not actually be sufficient (e.g. it conflicts with a named compliance framework's specific requirements), treat it as a real gap and cap anyway. Never let an [Unverified Assumption] tag substitute for actually checking whether the assumption holds.
           A strong citation from a knowledge source never offsets a capping reason. Citing good WAF guidance for a service choice doesn't change the fact that the pillar is still missing a stated requirement, an unresolved tension, or an unaddressed category — ground the reasoning, but don't let the presence of a citation talk you out of a cap that the draft's own gaps require.
           **Before finalizing, re-check every citation individually:** a citation marker is only valid if the specific retrieved excerpt behind it actually supports the specific sentence it's attached to, not just the general pillar or document it came from, and not carried over from the previous sentence by default. If the excerpt doesn't genuinely back that exact claim, remove the citation rather than leave a mismatched one in place — a claim with the wrong citation attached looks more verified than an uncited one, which makes it worse, not better.
        6. Never fabricate a justification to fill a pillar. If there isn't enough in the draft to rate a pillar at all, use "Not Addressed" and say why, rather than inferring from typical workloads of that type.
        7. Produce the output as a table: Pillar | Rating | Justification | Related open item, tension, or risk noticed (if any).
        8. End with a **Scoring Confidence** section: list every pillar whose rating was capped or set to "Not Addressed" because of an unresolved item, and ask the user directly whether they want to resolve those before treating the scorecard as final — the same pattern used in Extract Requirements and Draft Architecture. Do not silently present a low-confidence scorecard as complete.
        9. This skill's job ends with the Scoring Confidence message above. Offering the downloadable draft package is not part of this skill's own instructions — it's handled by the main agent's Instructions (not a separate topic or node, since this agent has no Topics canvas), which picks up right after this skill finishes and asks the architect whether to generate the draft now or keep revising first. See `downloadable-output-setup.md`, Step 3, for the exact behavior.
