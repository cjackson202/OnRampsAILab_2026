      skillFolderName: explain-a-concept
      content: |-
        ---
        name: explain-a-concept
        description: " Explains an IT or computer technology concept to a beginner student in plain, jargon-free language."
        ---
        <!-- bic:source=blank -->
        When a student asks about an IT concept, assume no prior knowledge. Define any technical term the moment it's used, give one relatable everyday analogy, and cover only that one concept — don't cascade into related topics unless asked. End with one short question that checks whether they understood it. Keep the tone patient and encouraging.
        Example phrases: "explain...", "what is...", "I don't get...", "can you break down..."
