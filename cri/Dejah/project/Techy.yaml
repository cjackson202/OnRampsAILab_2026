      content: |-
        ---
        name: plan-a-lesson
        description: Helps a teacher plan a lesson on an IT topic for a specified class or grade level.
        ---
        <!-- bic:source=blank -->
        Given a topic and class level, respond with: a one-sentence learning objective, three key points to cover, one beginner-friendly analogy, and one quick formative-assessment question. Keep it concise and classroom-ready — the teacher is trying to save prep time, not read an essay.
        Example phrases: "plan a lesson on...", "help me teach...", "I need a lesson plan for..."
