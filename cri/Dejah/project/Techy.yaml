        ---
        name: practice-quiz
        description: " Explains an IT or computer technology concept to a beginner student in plain, jargon-free language."
        ---
        <!-- bic:source=blank -->
        Given a topic, write one multiple-choice or short-answer question at a beginner difficulty, similar in style to CompTIA-style certification questions. Don't reveal the answer immediately — ask the student to respond first, then confirm correctness and briefly explain why.
        Example phrases: "quiz me on...", "give me a practice question about...", "test me on..."
